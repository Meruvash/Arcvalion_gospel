<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Fazenda da herança · tanto por tanto</title>
<style>
@font-face{font-family:'Caveat';src:url(caveat-700.woff2) format('woff2');font-weight:700}
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#f3ead8}
#c{position:absolute;left:0;top:0;z-index:1}
#labels{position:absolute;inset:0;z-index:5;font-family:'Caveat';color:#2b211a}
.t{position:absolute;opacity:0;white-space:nowrap;font:700 60px/1 'Caveat'}
</style></head><body>
<div id="labels"></div>
<script src="brush.js"></script>
<script>
// Fazenda da herança vista de cima, em aquarela e lápis (p5.brush). Mapa ilustrativo, sem caso real.
// Fala 3: a fazenda inteira, sem divisões, com os três herdeiros sobre a mesma área ("como num condomínio").
// Fala 4: um estranho chega de fora com o dinheiro ("estranho"). Fala 5: a parte volta para "você" ("depositar").
const S = 1080; brush.createCanvas(S, S, { id: 'c' }); brush.scaleBrushes(1.4);
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x), ramp = (t, a, d) => ease((t - a) / d);
const q = new URLSearchParams(location.search), T = k => +(q.get(k) ?? ({ irmaos: 2.9, estranho: 8.7, deposito: 13.3 })[k]);
const L = document.getElementById('labels');
const add = (html, x, y, rot = -3, extra = '') => { const d = document.createElement('div'); d.className = 't'; d.innerHTML = html; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.transform = `rotate(${rot}deg)`; d.style.cssText += extra; L.appendChild(d); return d; };
const poly = (pts, cor, op, bleed = .15) => { brush.noStroke(); brush.fill(cor, op); brush.fillBleed(bleed, 'out'); brush.fillTexture(.55, .35); brush.beginShape(); pts.forEach(([x, y]) => brush.vertex(x, y)); brush.endShape(true); brush.noFill(); };
const pencil = (pts, peso = 1.6, cor = '#3a3026', close = false) => { brush.set('2B', cor, peso); brush.beginShape(); pts.forEach(([x, y]) => brush.vertex(x, y)); brush.endShape(close); };
const FAZ = [[110, 170], [930, 130], [990, 560], [900, 940], [170, 970], [80, 560]];
const lTit = add('fazenda da herança', 250, 52, -2, 'font-size:68px');
const lA = add('irmã', 220, 330, -6), lB = add('irmão', 680, 280, 4), lV = add('você', 440, 640, -3, 'font-size:76px;color:#1e4a14');
const lE = add('estranho', 690, 940, -4, 'color:#8a2a18;font-size:56px'), lP = add('a parte vendida', 560, 470, -5, 'font-size:46px;color:#8a2a18;background:rgba(243,234,216,.8);padding:2px 10px');
const lVolta = add('volta pra você', 380, 730, -3, 'font-size:56px;color:#1e4a14;background:rgba(243,234,216,.8);padding:2px 10px');
draw = (t) => {
  brush.seed(77); brush.noiseSeed(77); brush.clear('#f3ead8'); brush.push(); brush.translate(-S / 2, -S / 2);
  const base = ramp(t, 0, .9);
  if (base > 0) {
    poly(FAZ, '#86bc56', 205 * base);                                                     // a fazenda inteira, sem divisões
    poly([[600, 620], [760, 600], [800, 720], [640, 760]], '#5a9ad0', 170 * base, .2);        // açude
    for (let k = 0; k < 7; k++) pencil([[170, 230 + k * 50], [500, 210 + k * 50]], 1.3 * base + .05, '#3a6a24');   // lavoura
    poly([[700, 820], [760, 820], [760, 870], [700, 870]], '#fff6dc', 255 * base, .04); poly([[690, 822], [730, 790], [770, 822]], '#8a2a18', 255 * base, .04);  // casa da família
    pencil([...FAZ, FAZ[0]], 2.2 * base + .05, '#5a3a20');                                   // divisa externa (cerca)
    pencil([[930, 1080], [880, 760], [760, 845]], 2 * base + .05, '#a07a40');                 // estrada até a casa
  }
  const ki = ramp(t, T('irmaos'), 1.2);                                                       // laço que une os três: a mesma terra, de todos
  if (ki > 0) { brush.set('charcoal', '#2b211a', 1.8); brush.beginShape(); const n = Math.max(3, Math.round(48 * ki)); for (let i = 0; i <= n; i++) { const a = i / 48 * Math.PI * 2; brush.vertex(500 + Math.cos(a) * 330, 520 + Math.sin(a) * 260); } brush.endShape(false); }
  const ke = ramp(t, T('estranho'), 1.6), kd = ramp(t, T('deposito'), 1.4);
  if (ke > 0) {                                                                               // a parte do irmão (um terço) vendida a estranho
    const cor = kd > 0 ? '#c8603a' : '#c8603a';
    poly([[520, 260], [930, 140], [985, 540], [560, 600]], kd > 0.5 ? '#4e8a2e' : cor, 200 * ke, .1);
    pencil([[930, 1060], [900 - 60 * ke, 1060 - 340 * ke]], 3, '#8a2a18');                     // seta do estranho entrando
    pencil([[900 - 60 * ke - 20, 1060 - 340 * ke + 30], [900 - 60 * ke, 1060 - 340 * ke], [900 - 60 * ke + 28, 1060 - 340 * ke + 20]], 3, '#8a2a18');
  }
  if (kd > 0) {                                                                               // seta de volta: depositado o preço, a parte vem para você
    pencil([[700, 420], [700 - 180 * kd, 420 + 220 * kd]], 3.4, '#1e4a14');
    pencil([[700 - 180 * kd - 30, 420 + 220 * kd - 14], [700 - 180 * kd, 420 + 220 * kd], [700 - 180 * kd + 6, 420 + 220 * kd - 34]], 3.4, '#1e4a14');
  }
  brush.pop(); brush.render();
  for (const l of [lTit, lA, lB, lV]) l.style.opacity = ramp(t, .4, .6);
  lE.style.opacity = ke * (1 - ramp(t, T('deposito') + .3, .6)); lP.style.opacity = ramp(t, T('estranho') + .9, .5) * (1 - ramp(t, T('deposito'), .5));
  lVolta.style.opacity = ramp(t, T('deposito') + .6, .5);
};
window.drawFrame = t => draw(t);
window.READY = document.fonts.ready.then(() => true);
</script></body></html>

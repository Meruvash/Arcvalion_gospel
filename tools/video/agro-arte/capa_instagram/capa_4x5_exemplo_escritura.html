<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Inter';src:url(inter-latin-900-normal.woff2) format('woff2');font-weight:900}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{background:url(bgb_f.jpg) center/cover}
.quad{position:absolute;left:90px;top:500px;width:900px;height:900px;background:url(quad.png) center/cover;border:8px solid #f6efd8;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.box{position:absolute;left:0;right:0;top:40px;text-align:center}
.chip{display:inline-block;font:900 42px 'Inter';letter-spacing:.08em;color:#14240f;background:#f0c24b;padding:10px 24px;border-radius:8px}
.big{font:900 104px/1 'Inter';color:#fff;margin-top:22px;-webkit-text-stroke:8px #14240f;paint-order:stroke fill;text-shadow:0 12px 34px rgba(0,0,0,.5)}
.sub{display:inline-block;font:900 50px/1.15 'Inter';color:#14240f;background:#fff6dc;margin-top:24px;padding:10px 26px;border-radius:8px}
.selo{position:absolute;left:0;right:0;margin:auto;width:max-content;top:calc(500px + 560px);padding:12px 30px;border:9px solid #c0281a;border-radius:14px;color:#c0281a;font:900 78px 'Inter';transform:rotate(-8deg);background:rgba(255,248,236,.9)}
</style></head><body><div class="quad"></div><div class="selo">SEM REGISTRO</div><div class="box"><div class="chip">TERRA E ESCRITURA</div>
<div class="big">COMPROU E NÃO<br>É DONO?</div><div class="sub">escritura na gaveta não basta</div></div></body></html>

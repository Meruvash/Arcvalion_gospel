<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Inter';src:url(inter-latin-900-normal.woff2) format('woff2');font-weight:900}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
body{background:url(bg_v.jpg) center/cover}
.sh{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(180deg,rgba(10,20,40,.55),rgba(10,20,40,.15) 70%,rgba(10,20,40,0))}

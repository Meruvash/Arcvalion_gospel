name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install -r requirements.txt
      - name: Padrão editorial (conteúdo real e exemplos)
        run: python3 tools/editorial/checar.py && python3 tools/editorial/checar.py --exemplo
      - name: Testes (Python e Worker)
        run: python3 -m unittest discover -s tests -v && node --test tests/worker.test.mjs
      - name: Build local e checagem de SEO
        run: python3 tools/build.py --sem-og && python3 tools/checar_seo.py publico
      - name: Isolamento em relação ao projeto de origem
        run: python3 tools/checar_isolamento.py

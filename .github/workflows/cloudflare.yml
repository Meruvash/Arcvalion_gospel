# Publica o site no Cloudflare (Worker "arcvalion", só arquivos estáticos) a partir do GitHub Actions.
# Roda a cada push na main e pelo botão "Run workflow". Precisa de dois segredos do repositório
# (Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN (token NOVO, só deste projeto, modelo
# "Edit Cloudflare Workers") e CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Conferir os segredos
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install -r requirements.txt
      - name: Testes e isolamento
        run: python3 -m unittest discover -s tests && python3 tools/checar_isolamento.py
      - name: Montar o site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          WORKERS_CI: "1"   # sem SITE_URL, serve na raiz (o endereço provisório do github.io tem caminho)
        run: python3 tools/build.py --producao --sem-og && python3 tools/checar_seo.py publico
      - name: Publicar no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy

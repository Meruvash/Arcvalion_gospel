# Deploy no GitHub Pages: a cada push na main (publicação aprovada em 29/10/2026) e pelo botão "Run workflow".
# Pré-requisitos (docs/DEPLOY.md): Settings > Pages > Source = GitHub Actions; domínio em config/portal.json;
# responsável editorial, e-mail e pelo menos uma pessoa revisora configurados (o build --producao recusa sem isso).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - run: pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: python3 -m unittest discover -s tests && python3 tools/checar_isolamento.py
      - run: python3 tools/build.py --producao && python3 tools/checar_seo.py publico
      - name: Domínio próprio (CNAME), só quando não for o endereço github.io
        run: python3 -c "import json;h=json.load(open('config/portal.json'))['url'].removeprefix('https://').split('/')[0];h.endswith('github.io') or open('publico/CNAME','w').write(h)"
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v3
        with: {path: publico}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

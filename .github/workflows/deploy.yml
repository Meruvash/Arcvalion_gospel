# Deploy no GitHub Pages: a cada push na main (publicação aprovada em 29/10/2026) e pelo botão "Run workflow".
# Como no Elite, o site é gerado na raiz do repositório por tools/build_home.py; aqui ele é gerado de novo e a raiz
# é publicada sem os arquivos de trabalho (tools, conteudo, docs, worker, exemplos e a lista "exclude" do _config.yml).
# Notas com "status": "revisao" saem só em /previa/ (noindex); nada vai ao ar sem a aprovação da pessoa revisora.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}   # o sitemap usa o histórico do git para a data da lista de livros
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - run: pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Padrão editorial, testes e isolamento
        run: |
          python3 tools/noticias/checar_noticia.py && python3 tools/estudos/checar_estudo.py
          python3 -m unittest discover -s tests
          python3 tools/checar_isolamento.py
      - name: Gerar o site na raiz
        run: python3 tools/build_home.py && python3 tools/checar_seo.py && python3 tools/checar_isolamento.py
      - name: Montar a pasta publicada (raiz sem os arquivos de trabalho)
        run: python3 tools/montar_publicacao.py _site
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
